<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Jimmy's Diner</title>
        <meta charset="utf-8">

        <link rel="stylesheet" href="styles/index.css">

        <!-- font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Smythe&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
    <header>
        <h1>Jimmy's Diner</h1>
        <p>The best burgers and pizzas in town</p>
    </header>

    <main>
        <div id="item-cards" class="item-cards">

        </div>
    </main>

    <section id="order-outcome" class="order-outcome">

    </section>

    <footer id="footer" class="footer hide">
        <h2>Your order</h2>
        <div id="order-history" class="order-history">
            <div class="order-items" id="order-items">

            </div>
            <div class="order-total" id="order-total">
                <h3>Total price:</h3>
                <p class="order-total-price" id="order-total-price">$0</p>
            </div>
        </div>

        <button class="checkout" id="checkout" data-action="completeOrder">Complete order</button>
    </footer>

    <dialog id="card-details" class="card-details" closedby="any">
        <div id="card-details-container" class="card-details-container">
            <div id="card-details-header" class="card-details-header">
                <h2>Enter card details</h2>
                <button type="button" class="close" id="close" data-action="closeCardDetailsModal">x</button>
            </div>
            <form id="card-form" class="card-form">
                <div class="card-form-container">
                    <label for="card-name">Full Name on Card</label>
                    <input type="text" id="card-name" name='card-name' pattern="[a-zA-Z ]*" placeholder="e.g. John Smith" required>
                </div>

                <div class="card-form-container">
                    <label for="card-number">Card Number</label>
                    <input type="text" id="card-number" name="card-number" pattern="[0-9]*" placeholder="e.g. 1234 5678 9000 0000" minlength="10" maxlength="20" required>
                </div>

                <div class="card-form-container">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" placeholder="e.g. 123" minlength="3" maxlength="3" required pattern="[0-9]{3}">
                </div>

                <button type="submit" class="pay" id="pay" data-action="submitPayment">Pay</button>
            </form>
        </div>
    </dialog>

	<script src="scripts/index.js" type="module"></script>
    </body>
</html>

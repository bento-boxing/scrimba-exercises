<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="container">
        <div class="teamboard">
            <h3>HOME</h3>
            <h2 class="scoreboard">0</h2>
            <div class="buttons">
                <button>+1</button>
                <button>+2</button>
                <button>+3</button>
            </div>
            <button class="reset-button">reset</button>
        </div>
        <div class="teamboard">
            <h3>GUEST</h3>
            <h2 class="scoreboard">0</h2>
            <div class="buttons">
                <button>+1</button>
                <button>+2</button>
                <button>+3</button>
            </div>
            <button class="reset-button">reset</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="movies, films">
    <meta name="description" content="Search all movies and add them to your watchlist.">
    <meta name="author" content="bento-boxing">
    <title>Find your Film</title>

    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1 class="header__title">Find your film</h1>
        <a href="./pages/watchlist.html" class="header__link">My Watchlist</a>
    </header>

    <form class="movie-searchbar">
        <div class="movie-searchbar__search-section">
            <label for="movie-searchbar__input" class="movie-searchbar__label">
                <i class="fa-solid fa-magnifying-glass"></i>
            </label>
            <input id="movie-searchbar__input" class="movie-searchbar__input" name="search-term" type="search" placeholder="e.g. Blade Runner">
        </div>

        <button type="submit" class="movie-searchbar__button">Search</button>
    </form>

    <section class="movie-results">
        <i class="fa-solid fa-clapperboard movie-results__placeholder-icon"></i>
        <p class="movie-results__placeholder-text">Start exploring</p>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="movies, films">
    <meta name="description" content="View movie watchlist">
    <meta name="author" content="bento-boxing">
    <title>My Watchlist</title>

    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
    <h1 class="header__title">Find your film</h1>
    <a href="../index.html" class="header__link">Search for movies</a>
</header>

<section class="movie-results" id="movie-results">
    <div class="movie-results__placeholder">
        <p class="movie-results__placeholder-text">Your watchlist is looking a little empty...</p>
        <a class="movie-results__prompt" href="../index.html">
            <i class="fa-solid fa-circle-plus movie-results__prompt-icon"></i>
            Let's add some movies!
        </a>
    </div>
</section>
<script src="../scripts/watchlist.js" type="module"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Oldagram</title>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav class="nav-container">
            <ul class="nav-list">
                <li><img src="images/logo.png" alt="Oldagram logo." class="logo"></li>
                <li><img src="images/user-avatar.png" alt="User avatar." class="avatar user-avatar"></li>
            </ul>
        </nav>

        <section class="post">
            <div class="post-header">
                <img class="avatar post-avatar" src="images/avatar-vangogh.jpg" alt="Vincent van Gogh's avatar">

                <div class="post-info">
                    <p class="bold post-author">Vincent van Gogh</p>
                    <p class="post-location">Zudert, Netherlands</p>
                </div>
            </div>

            <img class="post-image" src="images/post-vangogh.jpg" alt="Vincent van Gogh abstract self portrait oil painting">

            <div class="reactions">
                <img class="heart" src="images/icon-heart.png" alt="Heart">
                <img class="comment" src="images/icon-comment.png" alt="Comment">
                <img class="dm" src="images/icon-dm.png" alt="DM">
            </div>

            <div class="bold likes">21,492 likes</div>

            <div class="comments">
                <p class="bold comment-author">vincey1853</p>
                <p class="comment-body">just took a few mushrooms lol</p>
            </div>
        </section>
        <script src="index.js"></script>
    </body>
</html>
